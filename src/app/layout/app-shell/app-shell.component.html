<header class="topbar">
  <button class="icon-button" (click)="menu = !menu" aria-label="Abrir menu">
    <i class="bi bi-list"></i></button
  ><a routerLink="/inicio" class="brand"
    ><span class="brand-mark"><i class="bi bi-broadcast-pin"></i></span
    ><span>Universal <strong>Remote</strong></span></a
  >
  <div class="spacer"></div>
  <span class="connection"><i></i> BTV Sala</span
  ><button class="icon-button" (click)="logout()" aria-label="Sair">
    <i class="bi bi-box-arrow-right"></i>
  </button>
</header>
<div class="scrim" *ngIf="menu" (click)="menu = false"></div>
<aside class="drawer" [class.open]="menu">
  <div class="drawer-head">
    <span class="eyebrow">NAVEGAÇÃO</span
    ><button class="icon-button" (click)="menu = false">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <nav (click)="menu = false">
    <a routerLink="/inicio" routerLinkActive="active"
      ><i class="bi bi-house"></i> Início</a
    ><a routerLink="/controle" routerLinkActive="active"
      ><i class="bi bi-controller"></i> Controle remoto</a
    ><a routerLink="/comando" routerLinkActive="active"
      ><i class="bi bi-stars"></i> Comando inteligente</a
    ><span class="nav-label">GERENCIAR</span
    ><a routerLink="/admin/dispositivos" routerLinkActive="active"
      ><i class="bi bi-hdd-network"></i> Dispositivos</a
    ><a routerLink="/admin/aplicativos" routerLinkActive="active"
      ><i class="bi bi-grid-3x3-gap"></i> Aplicativos</a
    ><a routerLink="/admin/macros" routerLinkActive="active"
      ><i class="bi bi-lightning-charge"></i> Macros</a
    ><a routerLink="/admin/intents" routerLinkActive="active"
      ><i class="bi bi-chat-square-text"></i> Intents</a
    ><a routerLink="/admin/dicionario" routerLinkActive="active"
      ><i class="bi bi-journal-text"></i> Dicionário</a
    ><a routerLink="/admin/automacoes" routerLinkActive="active"
      ><i class="bi bi-clock-history"></i> Automações</a
    ><span class="nav-label">MONITORAR</span
    ><a routerLink="/admin/execucoes" routerLinkActive="active"
      ><i class="bi bi-activity"></i> Execuções</a
    ><a routerLink="/admin/filas" routerLinkActive="active"
      ><i class="bi bi-list-ol"></i> Filas</a
    ><a routerLink="/admin/diagnostico" routerLinkActive="active"
      ><i class="bi bi-wrench-adjustable"></i> Diagnóstico</a
    ><a routerLink="/admin/screenshots" routerLinkActive="active"
      ><i class="bi bi-images"></i> Screenshots</a
    ><a routerLink="/admin/configuracoes" routerLinkActive="active"
      ><i class="bi bi-gear"></i> Configurações</a
    >
  </nav>
</aside>
<main><router-outlet></router-outlet></main>
