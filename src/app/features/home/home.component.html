<div class="page">
  <header class="mb-4">
    <p class="eyebrow">CONTROLE</p>
    <h1>O que deseja fazer?</h1>
  </header>
  <div class="alert alert-info" *ngIf="message">{{ message }}</div>
  <section class="app-grid">
    <button
      class="app-card"
      *ngFor="let macro of macros"
      (click)="choose(macro)"
      [disabled]="running"
    >
      <span class="app-icon neutral"><i class="bi bi-play-fill"></i></span
      ><strong>{{ macro.name }}</strong
      ><small>{{ macro.description || "Executar agora" }}</small>
    </button>
  </section>
  <div class="panel p-4 text-center" *ngIf="!macros.length">
    <p class="mb-3">Nenhuma macro criada.</p>
    <a class="btn btn-accent" routerLink="/admin/macros"
      >Criar primeira macro</a
    >
  </div>
  <div class="modal-layer" *ngIf="selectedMacro">
    <form class="panel editor" (ngSubmit)="confirmInput()">
      <div class="modal-heading">
        <span class="modal-icon"><i class="bi bi-search"></i></span>
        <div>
          <small>EXECUTAR MACRO</small>
          <h2>{{ selectedMacro.name }}</h2>
        </div>
        <button
          type="button"
          class="icon-button"
          (click)="selectedMacro = null"
          aria-label="Fechar"
        >
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <label class="form-label mt-4">{{ selectedMacro.inputLabel }}</label
      ><input
        class="form-control"
        name="inputValue"
        [(ngModel)]="inputValue"
        autocomplete="off"
        placeholder="Digite aqui"
        required
      />
      <div class="d-flex justify-content-end gap-2 mt-4">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="selectedMacro = null"
        >
          Cancelar</button
        ><button class="btn btn-accent" [disabled]="!inputValue.trim()">
          Executar
        </button>
      </div>
    </form>
  </div>
</div>
