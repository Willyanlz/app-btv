<div class="page">
  <section class="hero">
    <div>
      <p class="eyebrow">BOA NOITE</p>
      <h1>O que vamos assistir?</h1>
      <p class="lead-copy">
        Controle a BTV, abra seus aplicativos ou simplesmente diga o que deseja.
      </p>
    </div>
    <a class="device-pill" routerLink="/admin/dispositivos"><span></span><div><small>Configuração</small><strong>Dispositivos</strong></div></a>
  </section>
  <section class="quick-commands">
    <h2 class="section-title">Comandos rápidos</h2>
    <div class="command-grid">
      <button
        class="command-chip"
        *ngFor="let command of commands"
        (click)="runCommand(command.id, command.label)"
      >
        <i class="bi bi-key"></i>
        <span>{{ command.label }}</span>
        <small>{{ command.aliases[0] }}</small>
      </button>
    </div>
  </section>
  <h2 class="section-title">Acesso rápido</h2>
  <div class="app-grid">
    <button
      class="app-card"
      *ngFor="let app of apps"
      (click)="open(app.name)"
    >
      <span class="app-icon neutral"><i class="bi bi-grid"></i></span
      ><strong>{{ app.name }}</strong
      ><small>{{ app.enabled ? "Disponível" : "Indisponível" }}</small></button
    ><button class="app-card" routerLink="/controle">
      <span class="app-icon neutral"><i class="bi bi-controller"></i></span
      ><strong>Controle</strong><small>Controle completo</small></button
    ><button class="app-card" routerLink="/admin/macros">
      <span class="app-icon neutral"
        ><i class="bi bi-lightning-charge"></i></span
      ><strong>Macros</strong><small>Atalhos inteligentes</small>
    </button>
  </div>
  <div
    *ngIf="message"
    class="toast-message"
    [class.has-error]="error"
  >{{ message }}</div>
</div>
