<div class="page">
  <div class="page-head">
    <div>
      <p class="eyebrow">CONTROLE REMOTO</p>
      <h1>Controle da BTV</h1>
      <p class="lead-copy">Nenhum comando é enviado automaticamente.</p>
    </div>
  </div>
  <div class="remote-layout">
    <section class="panel p-3 remote-panel">
      <label class="form-label">Dispositivo</label>
      <select
        class="form-select"
        [(ngModel)]="deviceId"
        (ngModelChange)="onDeviceChange()"
      >
        <option value="">Selecione</option>
        <option *ngFor="let item of devices" [value]="item.id">
          {{ item.name }}
        </option>
      </select>
      <div class="d-flex align-items-center gap-2 mt-2">
        <button
          class="btn btn-outline-info"
          (click)="test()"
          [disabled]="!deviceId"
        >
          Testar conexão
        </button>
        <span class="connection-badge" [class.ok]="connection === 'device'">
          <i
            class="bi"
            [ngClass]="connection === 'device' ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill'"
          ></i>
          {{ connection }}
        </span>
      </div>
      <div class="mt-3">
        <app-remote-pad (pressed)="press($event)"></app-remote-pad>
        <div class="media-row">
          <button (click)="press('VOLUME_DOWN')">
            <i class="bi bi-volume-down"></i></button
          ><button (click)="press('MUTE')">
            <i class="bi bi-volume-mute"></i></button
          ><button (click)="press('PLAY_PAUSE')">
            <i class="bi bi-play-fill"></i></button
          ><button (click)="press('VOLUME_UP')">
            <i class="bi bi-volume-up"></i>
          </button>
        </div>
        <form (ngSubmit)="sendText()" class="input-group mt-3">
          <input
            class="form-control"
            [(ngModel)]="text"
            name="text"
            placeholder="Texto para a TV"
            [disabled]="busy"
          /><button
            class="btn btn-accent"
            [disabled]="!deviceId || !text || busy"
          >
            Enviar
          </button>
        </form>
      </div>
    </section>
    <section class="panel screen-panel">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>Tela da TV</strong>
        <div class="d-flex gap-2 align-items-center">
          <label class="small-toggle">
            <input
              type="checkbox"
              [(ngModel)]="autoRefresh"
              name="autoRefresh"
            />
            Automático
          </label>
          <button
            class="btn btn-sm btn-outline-secondary"
            (click)="refreshScreen()"
            [disabled]="!deviceId || busy"
            title="Atualizar tela agora"
          >
            <i class="bi bi-arrow-repeat"></i>
          </button>
        </div>
      </div>
      <div class="screen" [class.loading]="screenState === 'loading'">
        <ng-container *ngIf="screenState === 'ok' && screenshotUrl">
          <img [src]="screenshotUrl" alt="Tela atual da TV" />
        </ng-container>
        <ng-container *ngIf="screenState === 'idle'">
          <i class="bi bi-tv"></i><span>Selecione um dispositivo para ver a tela.</span>
        </ng-container>
        <ng-container
          *ngIf="screenState === 'loading' && !screenshotUrl"
        >
          <i class="bi bi-camera"></i><span>Capturando a tela...</span>
        </ng-container>
        <ng-container *ngIf="screenState === 'error'">
          <i class="bi bi-camera-video-off"></i
          ><span
            >Não foi possível capturar a tela.<br /><a
              class="text-info cursor-pointer"
              (click)="refreshScreen()"
              >Tentar de novo</a
            ></span
          >
        </ng-container>
      </div>
    </section>
  </div>
</div>
