<div class="page"><div class="page-head"><div><p class="eyebrow">CONTROLE REMOTO</p><h1>Controle da BTV</h1><p class="lead-copy">Nenhum comando é enviado automaticamente.</p></div></div><div class="panel p-3 mb-3"><label class="form-label">Dispositivo</label><select class="form-select" [(ngModel)]="deviceId"><option value="">Selecione</option><option *ngFor="let item of devices" [value]="item.id">{{ item.name }}</option></select><button class="btn btn-outline-info mt-2" (click)="test()" [disabled]="!deviceId">Testar conexão</button><span class="ms-3">{{ connection }}</span></div><section class="panel remote-panel" [class.opacity-50]="!deviceId"><app-remote-pad (pressed)="press($event)"></app-remote-pad><div class="media-row"><button (click)="press('VOLUME_DOWN')"><i class="bi bi-volume-down"></i></button><button (click)="press('MUTE')"><i class="bi bi-volume-mute"></i></button><button (click)="press('PLAY_PAUSE')"><i class="bi bi-play-fill"></i></button><button (click)="press('VOLUME_UP')"><i class="bi bi-volume-up"></i></button></div><form (ngSubmit)="sendText()" class="input-group mt-4"><input class="form-control" [(ngModel)]="text" name="text" placeholder="Texto para a TV"><button class="btn btn-accent" [disabled]="!deviceId">Enviar</button></form></section><p class="feedback" *ngIf="feedback">{{ feedback }}</p></div>
