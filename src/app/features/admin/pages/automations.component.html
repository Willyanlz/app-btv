<div class="page"><div class="page-head"><div><p class="eyebrow">AUTOMAÇÕES</p><h1>Quando executar</h1><p class="lead-copy">Associe um horário a uma macro pronta.</p></div><button class="btn btn-accent" (click)="create()">Nova automação</button></div><div class="automation-grid"><article class="panel automation" *ngFor="let item of items"><h2 class="h5">{{ item.name }}</h2><p>{{ name(macros,item.macroId) }} · {{ name(devices,item.deviceId) }}</p><p>{{ item.schedule }}</p><button class="btn btn-sm btn-outline-info" (click)="run(item)">Executar agora</button><button class="btn btn-sm btn-outline-secondary ms-2" (click)="edit(item)">Editar</button><button class="btn btn-sm btn-outline-danger ms-2" (click)="remove(item)">Excluir</button></article><p *ngIf="!items.length">Nenhuma automação cadastrada.</p></div><div class="modal-layer" *ngIf="editing"><form class="panel editor" (ngSubmit)="save()"><h2 class="h4">Automação</h2><label class="form-label">Identificador</label><input class="form-control" name="id" [(ngModel)]="editing.id" [readonly]="!editing.isNew" required><label class="form-label mt-3">Nome</label><input class="form-control" name="name" [(ngModel)]="editing.name" required><label class="form-label mt-3">Dispositivo</label><select class="form-select" name="device" [(ngModel)]="editing.deviceId" required><option value="">Selecione</option><option *ngFor="let x of devices" [value]="x.id">{{x.name}}</option></select><label class="form-label mt-3">Macro</label><select class="form-select" name="macro" [(ngModel)]="editing.macroId" required><option value="">Selecione</option><option *ngFor="let x of macros" [value]="x.id">{{x.name}}</option></select><label class="form-label mt-3">Agendamento</label><input class="form-control" name="schedule" [(ngModel)]="editing.schedule" required><div class="mt-4 text-end"><button type="button" class="btn btn-outline-secondary me-2" (click)="editing=null">Cancelar</button><button class="btn btn-accent">Salvar</button></div></form></div></div>
