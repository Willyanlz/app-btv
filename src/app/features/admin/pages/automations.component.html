<div class="page"><div class="page-head"><div><p class="eyebrow">AUTOMAÇÕES</p><h1>Quando executar</h1><p class="lead-copy">Agende macros sem misturar a regra de tempo com o que será executado.</p></div><button class="btn btn-accent" (click)="create()"><i class="bi bi-plus-lg"></i> Nova automação</button></div><div class="automation-grid"><article class="panel automation" *ngFor="let item of items"><div class="d-flex justify-content-between"><span class="automation-icon"><i class="bi bi-clock"></i></span><div class="dropdown"><button class="btn btn-sm btn-outline-secondary" (click)="edit(item)"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger ms-1" (click)="remove(item)"><i class="bi bi-trash"></i></button></div></div><h2 class="h5 mt-3">{{item.name}}</h2><p class="text-muted-custom">{{item.macro}} · {{item.device}}</p><div class="meta"><span><i class="bi bi-calendar3"></i> {{item.trigger}}</span><span><i class="bi bi-arrow-repeat"></i> {{item.nextRun}}</span></div><div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox" [ngModel]="item.enabled" (ngModelChange)="store.toggle(item.id,$event)"><label class="form-check-label">{{item.enabled?'Ativa':'Pausada'}}</label></div></article></div><div class="modal-layer" *ngIf="formOpen"><form class="panel editor" [formGroup]="form" (ngSubmit)="save()"><div class="d-flex justify-content-between"><div><p class="eyebrow">AUTOMAÇÃO</p><h2 class="h4">{{editingId?'Editar':'Criar'}} automação</h2></div><button type="button" class="btn-close btn-close-white" (click)="formOpen=false"></button></div><div class="row g-3 mt-2"><div class="col-12"><label class="form-label">Nome</label><input class="form-control" formControlName="name"></div><div class="col-md-6"><label class="form-label">Dispositivo</label><select class="form-select" formControlName="device"><option>BTV Sala</option></select></div><div class="col-md-6"><label class="form-label">Macro</label><select class="form-select" formControlName="macro"><option *ngFor="let macro of data.macros">{{macro.name}}</option></select></div><div class="col-md-6"><label class="form-label">Frequência</label><select class="form-select" formControlName="frequency"><option>Uma vez</option><option>Diariamente</option><option>Semanalmente</option><option>Webhook</option></select></div><div class="col-md-6"><label class="form-label">Horário</label><input type="time" class="form-control" formControlName="time"></div><div class="col-12"><label class="form-label">Timezone</label><select class="form-select" formControlName="timezone"><option>America/Sao_Paulo</option></select></div></div><div class="d-flex justify-content-end gap-2 mt-4"><button type="button" class="btn btn-outline-secondary" (click)="formOpen=false">Cancelar</button><button class="btn btn-accent" [disabled]="form.invalid">Salvar automação</button></div></form></div></div>
