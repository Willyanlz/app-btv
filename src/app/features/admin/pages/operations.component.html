<div class="page">
  <div class="page-head">
    <div>
      <p class="eyebrow">MONITORAR</p>
      <h1>{{ title }}</h1>
      <p class="lead-copy">{{ descriptions[kind] }}</p>
    </div>
    <button
      class="btn btn-accent"
      *ngIf="kind === 'diagnostics'"
      (click)="diagnose()"
    >
      <i class="bi bi-arrow-repeat"></i> Reconectar
    </button>
  </div>
  <section class="panel p-4" [ngSwitch]="kind">
    <div *ngSwitchCase="'executions'" class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Data</th>
            <th>Device</th>
            <th>Macro</th>
            <th>Status</th>
            <th>Duração</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let x of executions">
            <td>{{ x.created_at }}</td>
            <td>{{ x.message }}</td>
            <td>{{ x.action }}</td>
            <td>
              <span class="badge badge-soft">{{ x.status }}</span>
            </td>
            <td>—</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngSwitchCase="'diagnostics'" class="diagnostic-grid">
      <p *ngIf="!checks.length">
        Clique em diagnosticar para consultar o primeiro dispositivo ativo.
      </p>
      <div *ngFor="let x of checks">
        <small>{{ x.label }}</small
        ><strong [class.ok]="x.ok">{{ x.value }}</strong>
      </div>
    </div>
  </section>
  <div class="alert alert-success mt-3" *ngIf="message">{{ message }}</div>
</div>
