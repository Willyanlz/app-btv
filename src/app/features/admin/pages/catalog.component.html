<div class="page">
  <div class="page-head"><div><p class="eyebrow">GERENCIAR</p><h1>{{ title }}</h1><p class="lead-copy">{{ subtitle }}</p></div><button class="btn btn-accent" (click)="openForm()">Novo</button></div>
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <section class="panel p-4"><p *ngIf="!rows.length">Nenhum registro cadastrado.</p><table class="table" *ngIf="rows.length"><tr *ngFor="let row of rows"><td>{{ kind === 'commands' ? row.label : row.name }}</td><td>{{ detail(row) }}</td><td class="text-end"><button class="btn btn-sm btn-outline-secondary" (click)="edit(row)">Editar</button><button class="btn btn-sm btn-outline-danger ms-2" (click)="remove(row)">Excluir</button></td></tr></table></section>
  <div class="modal-layer" *ngIf="editing"><form class="panel editor" (ngSubmit)="save()"><h2 class="h4">{{ editing.isNew ? 'Criar' : 'Editar' }} {{ title }}</h2><label class="form-label mt-3">Identificador</label><input class="form-control" name="id" [(ngModel)]="editing.id" [readonly]="!editing.isNew" required><ng-container *ngIf="kind!=='commands'"><label class="form-label mt-3">Nome</label><input class="form-control" name="name" [(ngModel)]="editing.name" required></ng-container><ng-container *ngIf="kind==='commands'"><label class="form-label mt-3">Rótulo</label><input class="form-control" name="label" [(ngModel)]="editing.label" required><label class="form-label mt-3">Aliases (um por linha)</label><textarea class="form-control" name="aliases" [(ngModel)]="editing.aliasesText"></textarea><label class="form-label mt-3">Teclas ADB (uma por linha)</label><textarea class="form-control" name="keys" [(ngModel)]="editing.keysText"></textarea></ng-container><ng-container *ngIf="kind==='devices'"><label class="form-label mt-3">IP ou host Tailscale</label><input class="form-control" name="host" [(ngModel)]="editing.host" required><label class="form-label mt-3">Porta ADB</label><input class="form-control" type="number" name="port" [(ngModel)]="editing.port" required></ng-container><ng-container *ngIf="kind==='apps'"><label class="form-label mt-3">Pacote Android</label><input class="form-control" name="packageName" [(ngModel)]="editing.packageName" required></ng-container><ng-container *ngIf="kind==='intents'"><label class="form-label mt-3">ID da macro</label><input class="form-control" name="macroId" [(ngModel)]="editing.macroId" required><label class="form-label mt-3">Frases, uma por linha</label><textarea class="form-control" name="phrases" [(ngModel)]="editing.phrasesText"></textarea></ng-container><div class="form-check mt-3"><input type="checkbox" name="enabled" [(ngModel)]="editing.enabled"> Ativo</div><div class="mt-4 text-end"><button type="button" class="btn btn-outline-secondary me-2" (click)="editing=null">Cancelar</button><button class="btn btn-accent">Salvar</button></div></form></div>
</div>
