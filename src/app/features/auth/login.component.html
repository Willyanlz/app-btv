<main class="login-page">
  <section class="login-card">
    <div class="login-orb"><i class="bi bi-broadcast-pin"></i></div>
    <p class="eyebrow mb-2">UNIVERSAL REMOTE</p>
    <h1>Sua TV, mais perto.</h1>
    <p class="text-muted-custom mb-4">Digite a senha para abrir seu controle inteligente.</p>
    <form (ngSubmit)="submit()">
      <label class="form-label">Senha de acesso</label>
      <div class="input-group input-group-lg">
        <span class="input-group-text bg-transparent border-secondary text-muted-custom"><i class="bi bi-lock"></i></span>
        <input class="form-control" type="password" inputmode="numeric" maxlength="6" name="password" [(ngModel)]="password" required autofocus placeholder="••••••" />
      </div>
      <div *ngIf="error" class="small text-danger mt-2"><i class="bi bi-exclamation-circle"></i> Senha incorreta ou API indisponível.</div>
      <button class="btn btn-accent btn-lg w-100 mt-4" [disabled]="loading">
        {{ loading ? 'Conectando…' : 'Entrar' }} <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </form>
    <small class="d-block text-center text-muted-custom mt-4">Sessão salva neste dispositivo</small>
  </section>
</main>
