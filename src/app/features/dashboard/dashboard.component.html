<div class="container py-4">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <p class="small text-info text-uppercase fw-bold mb-1">
        Universal Remote
      </p>
      <h1 class="h3 mb-0">BTV Sala</h1>
    </div>
    <button class="btn btn-outline-secondary" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </header>
  <div
    *ngIf="message"
    class="alert"
    [class.alert-success]="!error"
    [class.alert-danger]="error"
  >
    {{ message }}
  </div>
  <div class="row g-4">
    <div class="col-lg-5">
      <section class="panel p-4">
        <div class="d-flex justify-content-between">
          <h2 class="h5">Controle</h2>
          <span
            class="badge"
            [class.text-bg-success]="status?.connection === 'device'"
            [class.text-bg-danger]="status?.connection !== 'device'"
            >{{ status?.connection || "verificando" }}</span
          >
        </div>
        <app-remote-pad (pressed)="press($event)"></app-remote-pad>
        <form class="input-group mt-4" (ngSubmit)="typeText()">
          <input
            class="form-control bg-dark text-light border-secondary"
            name="text"
            [(ngModel)]="text"
            placeholder="Digite na TV"
          /><button class="btn btn-accent">Enviar</button>
        </form>
      </section>
    </div>
    <div class="col-lg-7">
      <section class="panel p-4 mb-4">
        <div class="d-flex justify-content-between">
          <h2 class="h5">Tela atual</h2>
          <button
            class="btn btn-sm btn-outline-info"
            (click)="refreshScreenshot()"
          >
            Atualizar
          </button>
        </div>
        <div class="ratio ratio-16x9 bg-black rounded overflow-hidden">
          <img
            *ngIf="imageUrl"
            [src]="imageUrl"
            class="object-fit-contain"
            alt="Captura da BTV"
          />
          <div
            *ngIf="!imageUrl"
            class="d-flex align-items-center justify-content-center text-muted-custom"
          >
            Captura indisponível
          </div>
        </div>
        <p class="small text-muted-custom mt-3 mb-0">
          {{ foreground || "Aplicativo não identificado" }}
        </p>
      </section>
      <section class="panel p-4">
        <h2 class="h5">Atividade recente</h2>
        <div
          class="small border-bottom border-secondary py-2"
          *ngFor="let log of logs"
        >
          <span class="text-info">{{ log.action }}</span> · {{ log.status }}
          <span class="text-muted-custom float-end">{{ log.created_at }}</span>
        </div>
      </section>
    </div>
  </div>
</div>
