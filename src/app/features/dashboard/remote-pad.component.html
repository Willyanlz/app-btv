<div class="remote mx-auto">
  <button class="btn key up" (click)="send('UP')">
    <i class="bi bi-chevron-up"></i></button
  ><button class="btn key left" (click)="send('LEFT')">
    <i class="bi bi-chevron-left"></i></button
  ><button class="btn key enter" (click)="send('ENTER')">OK</button
  ><button class="btn key right" (click)="send('RIGHT')">
    <i class="bi bi-chevron-right"></i></button
  ><button class="btn key down" (click)="send('DOWN')">
    <i class="bi bi-chevron-down"></i>
  </button>
</div>
<div class="d-flex gap-2 justify-content-center mt-3">
  <button class="btn btn-outline-light" (click)="send('BACK')">
    <i class="bi bi-arrow-left"></i> Voltar</button
  ><button class="btn btn-outline-light" (click)="send('HOME')">
    <i class="bi bi-house"></i> Home
  </button>
</div>
