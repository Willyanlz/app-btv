<div class="remote mx-auto">
  <button class="btn key up" [disabled]="disabled" (click)="send('UP')">
    <i class="bi bi-chevron-up"></i></button
  ><button class="btn key left" [disabled]="disabled" (click)="send('LEFT')">
    <i class="bi bi-chevron-left"></i></button
  ><button class="btn key enter" [disabled]="disabled" (click)="send('ENTER')">
    OK</button
  ><button class="btn key right" [disabled]="disabled" (click)="send('RIGHT')">
    <i class="bi bi-chevron-right"></i></button
  ><button class="btn key down" [disabled]="disabled" (click)="send('DOWN')">
    <i class="bi bi-chevron-down"></i>
  </button>
</div>
<div class="d-flex gap-2 justify-content-center mt-3">
  <button
    class="btn btn-outline-light"
    [disabled]="disabled"
    (click)="send('BACK')"
  >
    <i class="bi bi-arrow-left"></i> Voltar</button
  ><button
    class="btn btn-outline-light"
    [disabled]="disabled"
    (click)="send('HOME')"
  >
    <i class="bi bi-house"></i> Home
  </button>
</div>
